name: Pull Request CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nextjs:
    name: Next.js checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: MITOO
      INTERNAL_API_URL: http://127.0.0.1:8000/api
      API_HOST: ""
      ANALYZE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Performance contract tests
        run: npm run test:performance

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint -- --quiet

      - name: Production build
        run: npm run build

  backend:
    name: Laravel checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax
        working-directory: backend
        run: php -l app/Http/Controllers/Api/CollectionController.php

      - name: Laravel tests
        working-directory: backend
        run: php artisan test

  deploy-contract:
    name: Safe deploy contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: |
          bash -n deploy.sh
          bash -n scripts/deploy/mitoo-deploy-lib.sh
          bash -n scripts/deploy/mitoo-deploy-orchestrator.sh
          bash -n scripts/deploy/tests/deploy-contract-tests.sh

      - name: PHP helper syntax
        run: php -l scripts/deploy/write-mysql-client-config.php

      - name: ShellCheck
        run: >-
          shellcheck
          deploy.sh
          scripts/deploy/mitoo-deploy-lib.sh
          scripts/deploy/mitoo-deploy-orchestrator.sh
          scripts/deploy/tests/deploy-contract-tests.sh

      - name: Deploy contract tests
        run: bash scripts/deploy/tests/deploy-contract-tests.sh
